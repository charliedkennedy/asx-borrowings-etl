name: Run ASX Maturity Screen Pilot

on:
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ETL
        env:
          # The repository secret is deliberately exposed only to this process.
          # The application reads OPENAI_API_KEY; ChuckKey is the requested secret name.
          OPENAI_API_KEY: ${{ secrets.ChuckKey }}
        run: |
          python src/asx_maturity_screen.py --pilot --input universe.csv --workdir . --output outputs/asx_maturity_screen.xlsx

      - name: Upload outputs artifact
        uses: actions/upload-artifact@v4
        with:
          name: asx-maturity-screen-pilot
          path: outputs/
          if-no-files-found: error

      - name: Check if PDFs were downloaded
        id: pdf_check
        shell: bash
        run: |
          shopt -s nullglob
          files=(pdfs/*.pdf pdfs/*.PDF)
          if [ ${#files[@]} -gt 0 ]; then
            echo "has_pdfs=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pdfs=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload PDF cache artifact
        if: steps.pdf_check.outputs.has_pdfs == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: asx-maturity-screen-pilot-pdfs
          path: pdfs/
          if-no-files-found: error
