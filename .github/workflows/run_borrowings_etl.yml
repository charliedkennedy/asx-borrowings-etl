name: Run ASX Maturity Screen Pilot

on:
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Run ETL
        env:
          # The repository secret is deliberately exposed only to this process.
          # GitHub normalises secret names to uppercase. The expression accepts
          # either the requested CHUCKKEY secret or the conventional name.
          OPENAI_API_KEY: ${{ secrets.CHUCKKEY || secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Missing Actions secret. Add repository secret CHUCKKEY (or OPENAI_API_KEY), then rerun."
            exit 2
          fi
          python src/asx_maturity_screen.py --pilot --input universe.csv --workdir . --output outputs/asx_maturity_screen.xlsx

      - name: Upload outputs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asx-maturity-screen-pilot
          path: outputs/
          if-no-files-found: error

      - name: Check if PDFs were downloaded
        id: pdf_check
        shell: bash
        run: |
          shopt -s nullglob
          files=(pdfs/*.pdf pdfs/*.PDF)
          if [ ${#files[@]} -gt 0 ]; then
            echo "has_pdfs=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pdfs=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload PDF cache artifact
        if: always() && steps.pdf_check.outputs.has_pdfs == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: asx-maturity-screen-pilot-pdfs
          path: pdfs/
          if-no-files-found: error

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asx-maturity-screen-pilot-evidence
          path: |
            results.jsonl
            page_images/
            pdfs/
            outputs/
          if-no-files-found: warn

      - name: Write retrieval errors to job summary
        if: always()
        run: |
          echo '## ASX retrieval results' >> "$GITHUB_STEP_SUMMARY"
          if [ -f results.jsonl ]; then
            python -c "import json; [print(f\"- {x['ticker']}: {x['status']} — {x.get('notes', '')}\") for x in map(json.loads, open('results.jsonl'))]" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '- No result file was produced; see the IDX smoke-test error above.' >> "$GITHUB_STEP_SUMMARY"
          fi
